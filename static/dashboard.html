<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teambit — My Boards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #F5F0E8;
            --surface: #FFFFFF;
            --border: #E2DDD6;
            --text: #1A1814;
            --muted: #7A756E;
            --accent: #3D5A80;
            --accent-hover: #2E4468;
            --danger: #C0392B;
            --radius: 10px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
        }

        /* NAV */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-user {
            font-size: 13px;
            color: var(--muted);
        }

        .btn-logout {
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 7px;
            font-size: 13px;
            font-family: inherit;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-logout:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        /* MAIN */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 32px;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .page-header h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .btn-primary {
            padding: 9px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* BOARDS GRID */
        .boards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .board-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: box-shadow 0.15s, transform 0.15s;
            position: relative;
        }

        .board-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            transform: translateY(-2px);
        }

        .board-color {
            width: 36px;
            height: 36px;
            min-height: 36px;
            border-radius: 8px;
            margin-bottom: 14px;
            display: block;
            flex-shrink: 0;
        }

        .board-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .board-date {
            font-size: 12px;
            color: var(--muted);
        }

        .board-delete {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: 6px;
            color: var(--muted);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.15s;
        }

        .board-card:hover .board-delete {
            opacity: 1;
        }

        .board-delete:hover {
            background: #FEE2E2;
            color: var(--danger);
        }

        .board-settings {
            position: absolute;
            top: 12px;
            right: 46px;
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: 6px;
            color: #2D9D5E;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.15s;
        }

        .board-card:hover .board-settings {
            opacity: 1;
        }

        .board-settings:hover {
            background: #E3F6EC;
        }

        /* EMPTY STATE */
        .empty {
            text-align: center;
            padding: 64px 0;
            color: var(--muted);
        }

        .empty p {
            font-size: 15px;
            margin-bottom: 16px;
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 28px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        .modal h3 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .modal label {
            font-size: 13px;
            font-weight: 500;
        }

        .modal input {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }

        .modal input:focus {
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        .btn-cancel {
            padding: 9px 16px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: var(--muted);
            cursor: pointer;
        }

        .btn-cancel:hover {
            border-color: var(--text);
            color: var(--text);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 14px;
        }

        /* SETTINGS MODAL */
        .settings-modal {
            max-width: 420px;
        }

        .settings-section {
            margin-bottom: 22px;
        }

        .settings-section-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .members-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
        }

        .member-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--bg);
            border-radius: 8px;
        }

        .member-info {
            display: flex;
            flex-direction: column;
        }

        .member-nickname {
            font-size: 13px;
            font-weight: 500;
        }

        .member-email {
            font-size: 11px;
            color: var(--muted);
        }

        .member-role {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .member-role.owner {
            background: #FEF3C7;
            color: #92400E;
        }

        .member-role.member {
            background: #E0F2FE;
            color: #075985;
        }

        .search-wrapper {
            position: relative;
        }

        .search-results {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            max-height: 180px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }

        .search-results.open {
            display: block;
        }

        .search-result-item {
            padding: 9px 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: background 0.1s;
        }

        .search-result-item:hover {
            background: var(--bg);
        }

        .search-result-item .member-nickname {
            font-size: 13px;
        }

        .search-result-item .member-email {
            font-size: 11px;
        }

        .search-empty {
            padding: 10px 12px;
            font-size: 12px;
            color: var(--muted);
            text-align: center;
        }

        .color-swatches {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .swatch {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.1s;
        }

        .swatch:hover {
            transform: scale(1.08);
        }

        .swatch.selected {
            border-color: var(--text);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <nav>
        <span class="nav-logo">Teambit</span>
        <div class="nav-right">
            <span class="nav-user" id="nav-user"></span>
            <button class="btn-logout" onclick="logout()">Sign out</button>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h2>My boards</h2>
            <button class="btn-primary" onclick="openModal()">+ New board</button>
        </div>

        <div id="boards-container">
            <div class="loading">Loading boards…</div>
        </div>
    </main>

    <!-- Create board modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h3>Create a board</h3>
            <div class="field">
                <label for="board-name">Board name</label>
                <input type="text" id="board-name" placeholder="e.g. Design sprint" autofocus>
            </div>
            <div class="field">
                <label for="board-color">Color</label>
                <input type="color" id="board-color" value="#F5EEDF">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="createBoard()">Create</button>
            </div>
        </div>
    </div>

    <!-- Board settings modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal settings-modal">
            <h3>Board settings</h3>

            <div class="settings-section">
                <div class="settings-section-title">Members</div>
                <div class="members-list" id="members-list">
                    <div class="loading">Loading…</div>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">Invite someone</div>
                <div class="search-wrapper">
                    <input type="text" class="modal-input-search" id="member-search"
                        placeholder="Search by nickname or email…" oninput="onMemberSearch()" autocomplete="off"
                        style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; outline:none;">
                    <div class="search-results" id="search-results"></div>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">Board color</div>
                <div class="color-swatches" id="color-swatches"></div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSettings()">Close</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API = 'http://localhost:8000';

        function getToken() {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/static/index.html'; return null; }
            return token;
        }

        function authHeaders() {
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${getToken()}`
            };
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/static/index.html';
        }

        function openModal() {
            document.getElementById('modal').classList.add('open');
            document.getElementById('board-name').focus();
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            document.getElementById('board-name').value = '';
        }

        function formatDate(iso) {
            return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function renderBoards(boards) {
            const container = document.getElementById('boards-container');

            if (boards.length === 0) {
                container.innerHTML = `
        <div class="empty">
          <p>No boards yet. Create your first one!</p>
          <button class="btn-primary" onclick="openModal()">+ New board</button>
        </div>`;
                return;
            }

            container.innerHTML = `<div class="boards-grid">${boards.map(b => `
      <div class="board-card" onclick="goToBoard(${b.board_id})">
        <div class="board-color" style="background:#${b.color}"></div>
        <div class="board-name">${b.name}</div>
        <div class="board-date">${formatDate(b.created_at)}</div>
        <button class="board-settings" onclick="openSettings(event, ${b.board_id}, '${b.color}')" title="Board settings">⚙</button>
        <button class="board-delete" onclick="deleteBoard(event, ${b.board_id})" title="Delete">✕</button>
      </div>`).join('')}
    </div>`;
        }

        async function loadBoards() {
            const token = getToken();
            if (!token) return;

            try {
                const res = await fetch(`${API}/boards/`, { headers: authHeaders() });
                if (res.status === 401) { logout(); return; }
                const boards = await res.json();
                renderBoards(boards);
            } catch {
                document.getElementById('boards-container').innerHTML =
                    '<div class="empty"><p>Failed to load boards.</p></div>';
            }
        }

        async function createBoard() {
            const name = document.getElementById('board-name').value.trim();
            if (!name) return;

            const color = document.getElementById('board-color').value.replace('#', '');

            try {
                const res = await fetch(`${API}/boards/`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ name, color })
                });

                if (res.ok) {
                    closeModal();
                    loadBoards();
                }
            } catch { }
        }

        async function deleteBoard(e, boardId) {
            e.stopPropagation();
            if (!confirm('Delete this board?')) return;

            try {
                await fetch(`${API}/boards/${boardId}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                loadBoards();
            } catch { }
        }

        function goToBoard(boardId) {
            localStorage.setItem('boardId', boardId);
            window.location.href = '/static/board.html';
        }

        // ── TOAST ────────────────────────────────────────────────────
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ── BOARD SETTINGS ───────────────────────────────────────────
        const PALETTE = ['F5EEDF', 'FFECD5', 'E3F6EC', 'E0F2FE', 'F7F2FC', 'FEE2E2', 'FEF3C7', 'D1FAE5'];
        let settingsBoardId = null;
        let searchDebounce = null;

        function openSettings(e, boardId, currentColor) {
            e.stopPropagation();
            settingsBoardId = boardId;
            document.getElementById('settings-modal').classList.add('open');
            document.getElementById('member-search').value = '';
            document.getElementById('search-results').classList.remove('open');
            renderColorSwatches(currentColor);
            loadMembers(boardId);
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('open');
            settingsBoardId = null;
        }

        function renderColorSwatches(currentColor) {
            const wrap = document.getElementById('color-swatches');
            wrap.innerHTML = PALETTE.map(c => `
      <div class="swatch ${c.toLowerCase() === (currentColor || '').toLowerCase() ? 'selected' : ''}"
           style="background:#${c}" onclick="pickColor('${c}')"></div>
    `).join('');
        }

        async function pickColor(color) {
            if (!settingsBoardId) return;
            try {
                const res = await fetch(`${API}/boards/${settingsBoardId}/color`, {
                    method: 'PATCH',
                    headers: authHeaders(),
                    body: JSON.stringify({ color })
                });
                if (res.ok) {
                    renderColorSwatches(color);
                    showToast('Color updated');
                    loadBoards();
                }
            } catch { }
        }

        async function loadMembers(boardId) {
            const list = document.getElementById('members-list');
            list.innerHTML = '<div class="loading">Loading…</div>';
            try {
                const res = await fetch(`${API}/boards/${boardId}/members`, { headers: authHeaders() });
                const members = await res.json();
                if (members.length === 0) {
                    list.innerHTML = '<div class="search-empty">No members yet</div>';
                    return;
                }
                list.innerHTML = members.map(m => `
        <div class="member-row">
          <div class="member-info">
            <span class="member-nickname">${m.nickname}</span>
            <span class="member-email">${m.email}</span>
          </div>
          <span class="member-role ${m.role}">${m.role}</span>
        </div>
      `).join('');
            } catch {
                list.innerHTML = '<div class="search-empty">Failed to load members</div>';
            }
        }

        function onMemberSearch() {
            clearTimeout(searchDebounce);
            const query = document.getElementById('member-search').value.trim();
            const resultsBox = document.getElementById('search-results');

            if (query.length === 0) {
                resultsBox.classList.remove('open');
                return;
            }

            searchDebounce = setTimeout(async () => {
                try {
                    const res = await fetch(`${API}/users/search?query=${encodeURIComponent(query)}`, {
                        headers: authHeaders()
                    });
                    const users = await res.json();

                    if (users.length === 0) {
                        resultsBox.innerHTML = '<div class="search-empty">No users found</div>';
                    } else {
                        resultsBox.innerHTML = users.map(u => `
            <div class="search-result-item" onclick="inviteUser(${u.user_id}, '${u.nickname}')">
              <span class="member-nickname">${u.nickname}</span>
              <span class="member-email">${u.email}</span>
            </div>
          `).join('');
                    }
                    resultsBox.classList.add('open');
                } catch { }
            }, 300);
        }

        async function inviteUser(userId, nickname) {
            if (!settingsBoardId) return;
            try {
                const res = await fetch(`${API}/boards/${settingsBoardId}/members`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ user_id: userId })
                });
                if (res.ok) {
                    showToast(`${nickname} added to the board`);
                    document.getElementById('member-search').value = '';
                    document.getElementById('search-results').classList.remove('open');
                    loadMembers(settingsBoardId);
                } else {
                    const data = await res.json();
                    showToast(data.detail || 'Could not add member');
                }
            } catch { }
        }

        // Close search results when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                document.getElementById('search-results').classList.remove('open');
            }
        });

        document.getElementById('settings-modal').addEventListener('click', function (e) {
            if (e.target === this) closeSettings();
        });

        // Close modal on overlay click
        document.getElementById('modal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        loadBoards();
    </script>
</body>

</html>
